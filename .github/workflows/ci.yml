name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v --cov=gemini_visual_mcp --cov-report=term-missing --cov-fail-under=80

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check src/ tests/

      - name: Check formatting
        run: ruff format --check src/ tests/

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version consistency
        run: |
          set -euo pipefail
          plugin=$(python -c "import json;print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          market=$(python -c "import json;print(json.load(open('.claude-plugin/marketplace.json'))['plugins'][0]['version'])")
          pyproj=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          dunder=$(grep -m1 '__version__ = ' src/gemini_visual_mcp/__init__.py | cut -d'"' -f2)
          echo "plugin=$plugin marketplace=$market pyproject=$pyproj __version__=$dunder"
          test "$plugin" = "$market" && test "$plugin" = "$pyproj" && test "$plugin" = "$dunder"

      - name: Validate plugin manifest
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .
